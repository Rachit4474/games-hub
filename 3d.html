<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Neural Scene · Rachit4474</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --cyan: #00f5ff;
      --magenta: #ff00aa;
      --bg: #05070a;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      overflow: hidden;
      background: var(--bg);
      color: #e6edf3;
      font-family: 'Share Tech Mono', monospace;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      display: block;
    }
    .ui {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 1.2rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
      z-index: 10;
    }
    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.4rem;
      background: linear-gradient(90deg, var(--cyan), var(--magenta));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .hint {
      font-size: 0.8rem;
      opacity: 0.7;
      color: var(--cyan);
      text-align: right;
      line-height: 1.4;
    }
    .back {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      color: var(--cyan);
      text-decoration: none;
      font-size: 0.85rem;
      opacity: 0.75;
      z-index: 10;
      pointer-events: auto;
    }
    .back:hover { opacity: 1; text-decoration: underline; }
  </style>
</head>
<body>
  <div class="ui">
    <h1>🌌 3D NEURAL SCENE</h1>
    <div class="hint">
      Drag to orbit<br>
      Scroll to zoom<br>
      Right-click to pan
    </div>
  </div>

  <div id="canvas-container"></div>
  <a href="index.html" class="back">← Back to Neural Hub</a>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const container = document.getElementById('canvas-container');

    // Scene
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x05070a, 0.035);

    // Camera
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(0, 4, 12);

    // Renderer
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x05070a, 1);
    container.appendChild(renderer.domElement);

    // Controls
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.minDistance = 4;
    controls.maxDistance = 40;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.6;

    // Lights
    const ambient = new THREE.AmbientLight(0x223344, 0.6);
    scene.add(ambient);

    const cyanLight = new THREE.PointLight(0x00f5ff, 2.5, 30);
    cyanLight.position.set(5, 6, 4);
    scene.add(cyanLight);

    const magentaLight = new THREE.PointLight(0xff00aa, 2, 25);
    magentaLight.position.set(-5, 3, -3);
    scene.add(magentaLight);

    const limeLight = new THREE.PointLight(0x00ff9f, 1.5, 20);
    limeLight.position.set(0, -2, 6);
    scene.add(limeLight);

    // Central wireframe icosahedron
    const icoGeo = new THREE.IcosahedronGeometry(2.2, 1);
    const icoMat = new THREE.MeshBasicMaterial({
      color: 0x00f5ff,
      wireframe: true,
      transparent: true,
      opacity: 0.85
    });
    const ico = new THREE.Mesh(icoGeo, icoMat);
    scene.add(ico);

    // Inner solid
    const innerGeo = new THREE.IcosahedronGeometry(1.4, 0);
    const innerMat = new THREE.MeshStandardMaterial({
      color: 0xff00aa,
      emissive: 0x330022,
      metalness: 0.7,
      roughness: 0.25
    });
    const inner = new THREE.Mesh(innerGeo, innerMat);
    scene.add(inner);

    // Orbiting rings
    const ringGroup = new THREE.Group();
    scene.add(ringGroup);

    function createRing(radius, color, speed) {
      const geo = new THREE.TorusGeometry(radius, 0.04, 8, 100);
      const mat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.7 });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.userData = { speed };
      ringGroup.add(mesh);
      return mesh;
    }
    createRing(3.2, 0x00f5ff, 0.4);
    createRing(3.8, 0xff00aa, -0.3);
    createRing(4.5, 0x00ff9f, 0.25);

    // Floating geometric widgets
    const widgets = [];
    const shapes = [
      new THREE.BoxGeometry(0.8, 0.8, 0.8),
      new THREE.OctahedronGeometry(0.6),
      new THREE.TetrahedronGeometry(0.7),
      new THREE.DodecahedronGeometry(0.55)
    ];
    const colors = [0x00f5ff, 0xff00aa, 0x00ff9f, 0xffaa00, 0xaa00ff];

    for (let i = 0; i < 18; i++) {
      const geo = shapes[i % shapes.length];
      const mat = new THREE.MeshStandardMaterial({
        color: colors[i % colors.length],
        emissive: colors[i % colors.length],
        emissiveIntensity: 0.25,
        metalness: 0.6,
        roughness: 0.3,
        wireframe: Math.random() > 0.6
      });
      const mesh = new THREE.Mesh(geo, mat);
      const angle = (i / 18) * Math.PI * 2;
      const radius = 6 + Math.random() * 4;
      mesh.position.set(
        Math.cos(angle) * radius,
        (Math.random() - 0.5) * 6,
        Math.sin(angle) * radius
      );
      mesh.userData = {
        rotSpeed: (Math.random() - 0.5) * 0.03,
        floatSpeed: 0.4 + Math.random() * 0.6,
        floatOffset: Math.random() * Math.PI * 2,
        originalY: mesh.position.y
      };
      scene.add(mesh);
      widgets.push(mesh);
    }

    // Particle field
    const particleCount = 600;
    const positions = new Float32Array(particleCount * 3);
    for (let i = 0; i < particleCount * 3; i++) {
      positions[i] = (Math.random() - 0.5) * 50;
    }
    const particleGeo = new THREE.BufferGeometry();
    particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const particleMat = new THREE.PointsMaterial({
      color: 0x00f5ff,
      size: 0.08,
      transparent: true,
      opacity: 0.7,
      blending: THREE.AdditiveBlending
    });
    const particles = new THREE.Points(particleGeo, particleMat);
    scene.add(particles);

    // Grid floor
    const grid = new THREE.GridHelper(40, 40, 0x00f5ff, 0x112233);
    grid.position.y = -5;
    grid.material.opacity = 0.25;
    grid.material.transparent = true;
    scene.add(grid);

    // Animation
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      ico.rotation.x = t * 0.25;
      ico.rotation.y = t * 0.35;
      inner.rotation.x = -t * 0.4;
      inner.rotation.y = -t * 0.3;

      ringGroup.children.forEach((ring, i) => {
        ring.rotation.x = t * ring.userData.speed * 0.5;
        ring.rotation.y = t * ring.userData.speed;
      });

      widgets.forEach(w => {
        w.rotation.x += w.userData.rotSpeed;
        w.rotation.y += w.userData.rotSpeed * 1.3;
        w.position.y = w.userData.originalY + Math.sin(t * w.userData.floatSpeed + w.userData.floatOffset) * 0.8;
      });

      particles.rotation.y = t * 0.02;

      // Subtle light movement
      cyanLight.position.x = Math.sin(t * 0.4) * 6;
      magentaLight.position.z = Math.cos(t * 0.3) * 5;

      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
